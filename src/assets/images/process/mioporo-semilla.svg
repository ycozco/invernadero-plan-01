<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Calendario de observación de germinación de Myoporum laetum</title><desc id="d">Separar semilla madura del fruto, sembrar limpia y húmeda con buena luz, observar desde el quinto mes y continuar el registro hasta cinco años según el estudio.</desc><defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 19px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.fruit{fill:#527862}.seed{fill:#e8c77a}.root{stroke:#d5c19a;stroke-width:3;fill:none;stroke-linecap:round}.leaf{fill:#759c76;stroke:#b2d3a7;stroke-width:2}</style></defs><rect class="bg" width="960" height="440" rx="4"/><g class="stage" data-step="0"><rect class="panel" x="18" y="18" width="220" height="404"/><text class="m" x="36" y="48">01 · SEMILLA</text><text class="h" x="36" y="83">Limpia el lote</text><path d="M91 123 C61 166 76 210 112 216 C150 208 157 166 127 123Z" class="fruit"/><ellipse cx="111" cy="175" rx="10" ry="18" class="seed"/><path d="M57 230 H161" stroke="#e8a27d" stroke-width="3" stroke-dasharray="6 5"/><text class="b" x="38" y="280">Retira la pulpa</text><text class="b" x="38" y="308">Etiqueta planta y fecha</text><text class="b" x="38" y="336">Fruto intacto: no germinó*</text></g><g class="stage" data-step="1"><rect class="panel" x="258" y="18" width="220" height="404"/><text class="m" x="276" y="48">02 · SIEMBRA</text><text class="h" x="276" y="83">Húmedo y con luz</text><path d="M302 155 Q367 125 432 155 L420 225 H315Z" fill="#796753"/><ellipse cx="367" cy="162" rx="8" ry="13" class="seed"/><path d="M367 158 V129" stroke="#90bd96" stroke-width="5"/><path class="leaf" d="M367 135 Q346 115 351 140 Q359 146 367 135Z"/><path d="M292 124 Q367 96 442 124" fill="none" stroke="#506255" stroke-width="5"/><text class="b" x="276" y="277">Invernadero sombreado</text><text class="b" x="276" y="305">Sin calefacción*</text><text class="b" x="276" y="333">Sustrato no especificado</text></g><g class="stage" data-step="2"><rect class="panel" x="498" y="18" width="220" height="404"/><text class="m" x="516" y="48">03 · INICIO</text><text class="h" x="516" y="83">≈ 5 meses</text><circle cx="608" cy="172" r="56" fill="none" stroke="#506255" stroke-width="10"/><path d="M608 116 A56 56 0 0 1 662 157" fill="none" stroke="#e8c77a" stroke-width="10"/><path d="M608 172 l0 -31 M608 172 l27 15" stroke="#eef4eb" stroke-width="4"/><text class="b" x="516" y="277">Primera germinación</text><text class="b" x="516" y="305">No descartar temprano</text><text class="b" x="516" y="333">Revisar periódicamente</text></g><g class="stage" data-step="3"><rect class="panel" x="738" y="18" width="204" height="404"/><text class="m" x="756" y="48">04 · AÑOS</text><text class="h" x="756" y="83">Seguimiento largo</text><path d="M776 164 H902" stroke="#506255" stroke-width="6"/><circle cx="785" cy="164" r="11" fill="#82c7dc"/><circle cx="813" cy="164" r="11" fill="#82c7dc"/><circle cx="841" cy="164" r="11" fill="#90bd96"/><circle cx="869" cy="164" r="11" fill="#e8c77a"/><circle cx="897" cy="164" r="11" fill="#e8a27d"/><text class="b" x="760" y="215">hasta 5 años*</text><text class="h" x="760" y="260">90% acumulado*</text><text class="b" x="756" y="313">Solo M. laetum</text><text class="b" x="756" y="341">No extrapolar al género</text></g><text x="18" y="436" fill="#9aa99e" font-family="sans-serif" font-size="12">*Burrows (1996), Nueva Zelanda. No identifica la especie local de San Camilo.</text></svg>
