<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="t d">
<title id="t">Guía esquemática del ensayo de esquejes de Duranta erecta</title><desc id="d">Seis láminas: asignación experimental, corte apical, retirada de hojas basales y tratamiento, colocación en tres medios, humedad y evaluación a siete semanas. Esquema interpretativo, no está a escala.</desc>
<defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 18px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.stem{stroke:#90bd96;stroke-width:8;fill:none;stroke-linecap:round}.twig{stroke:#90bd96;stroke-width:5;fill:none;stroke-linecap:round}.leaf{fill:#759c76;stroke:#b2d3a7;stroke-width:2}.root{stroke:#d5c19a;stroke-width:3;fill:none;stroke-linecap:round}.pot{fill:#232e27;stroke:#82c7dc;stroke-width:2}.accent{fill:#e8a27d}.rule{stroke:#e8a27d;stroke-width:3;stroke-dasharray:6 5}</style></defs>
<rect class="bg" width="960" height="590" rx="4"/>
<g class="stage" data-step="0"><rect class="panel" x="16" y="16" width="296" height="265"/><text class="m" x="34" y="43">01 · DISEÑO</text><text class="h" x="34" y="70">Asigna antes de cortar</text><rect x="43" y="96" width="70" height="46" rx="4" fill="#232e27" stroke="#506255"/><rect x="127" y="96" width="70" height="46" rx="4" fill="#232e27" stroke="#506255"/><rect x="211" y="96" width="70" height="46" rx="4" fill="#232e27" stroke="#506255"/><text class="b" x="49" y="124">Arena</text><text class="b" x="134" y="124">Pino</text><text class="b" x="218" y="124">Turba</text><text class="b" x="40" y="171">4 niveles AIB × 3 medios</text><text class="h" x="40" y="202">360 esquejes</text><text class="b" x="40" y="227">3 repeticiones · 10 por unidad</text><text class="b" x="40" y="251">Etiqueta lote, madre y fecha</text></g>
<g class="stage" data-step="1"><rect class="panel" x="332" y="16" width="296" height="265"/><text class="m" x="350" y="43">02 · CORTE APICAL</text><text class="h" x="350" y="70">Punta blanda · 10 cm</text><path class="stem" d="M480 229 C477 190 484 142 477 96"/><path class="twig" d="M479 158 L443 130 M481 174 L518 146"/><path class="leaf" d="M443 130 Q404 107 425 146 Q441 151 443 130Z"/><path class="leaf" d="M518 146 Q551 121 541 157 Q525 164 518 146Z"/><circle cx="477" cy="151" r="6" class="accent"/><circle cx="481" cy="176" r="6" class="accent"/><path class="rule" d="M430 224 H530"/><text class="b" x="355" y="250">≥ 2 yemas · sin botones florales</text><text class="b" x="350" y="104">Punta sana, planta madura</text></g>
<g class="stage" data-step="2"><rect class="panel" x="648" y="16" width="296" height="265"/><text class="m" x="666" y="43">03 · PREPARACIÓN</text><text class="h" x="666" y="70">Limpia la base</text><path class="stem" d="M800 112 V218"/><path class="twig" d="M800 139 L768 118 M800 160 L831 140"/><path class="leaf" d="M768 118 Q737 99 750 132 Q765 137 768 118Z"/><path class="leaf" d="M831 140 Q858 119 851 151 Q838 158 831 140Z"/><path class="rule" d="M760 178 H839"/><path d="M749 182 l12 12 m0 -12 l-12 12 M840 182 l12 12 m0 -12 l-12 12" stroke="#e8a27d" stroke-width="3"/><rect x="783" y="211" width="34" height="15" rx="4" fill="#e8a27d"/><text class="b" x="669" y="246">Retira hojas inferiores</text><text class="b" x="669" y="267">AIB: base 5 mm · 10 s*</text></g>
<g class="stage" data-step="3"><rect class="panel" x="16" y="305" width="296" height="265"/><text class="m" x="34" y="332">04 · MEDIO</text><text class="h" x="34" y="359">Inserta y etiqueta</text><path class="pot" d="M52 399 H119 L109 468 H63Z"/><path class="pot" d="M143 399 H210 L200 468 H154Z"/><path class="pot" d="M234 399 H301 L291 468 H245Z"/><path d="M85 394 V430 M176 394 V430 M267 394 V430" class="stem"/><path class="root" d="M85 430 l-9 15 m9 -15 l9 17 M176 430 l-9 15 m9 -15 l9 17 M267 430 l-9 15 m9 -15 l9 17"/><text class="b" x="52" y="493">Arena</text><text class="b" x="140" y="493">Corteza</text><text class="b" x="231" y="493">Turba:perlita</text><text class="b" x="37" y="534">Mantén cada tratamiento separado</text></g>
<g class="stage" data-step="4"><rect class="panel" x="332" y="305" width="296" height="265"/><text class="m" x="350" y="332">05 · AMBIENTE</text><text class="h" x="350" y="359">Humedad registrada</text><path class="stem" d="M480 462 V390"/><path class="leaf" d="M480 417 Q442 385 448 425 Q463 440 480 417Z"/><path class="leaf" d="M480 435 Q518 402 512 442 Q497 455 480 435Z"/><path d="M411 384 Q480 353 549 384" fill="none" stroke="#506255" stroke-width="5"/><path d="M424 389 l-4 11 M480 373 v12 M536 389 l4 11" stroke="#82c7dc" stroke-width="5" stroke-linecap="round"/><text class="b" x="356" y="493">Estudio: aspersión 15 min</text><text class="b" x="356" y="518">2 veces al día</text><text class="b" x="356" y="543">No es horario universal</text></g>
<g class="stage" data-step="5"><rect class="panel" x="648" y="305" width="296" height="265"/><text class="m" x="666" y="332">06 · EVALUACIÓN</text><text class="h" x="666" y="359">Semana 7</text><path class="pot" d="M744 408 H859 L846 476 H757Z"/><path class="stem" d="M801 408 V375 M801 390 L779 375 M801 397 L823 378"/><path class="root" d="M801 435 l-25 22 m25 -18 l20 28 m-13 -36 l19 7"/><circle cx="801" cy="383" r="29" fill="none" stroke="#e8c77a" stroke-width="2"/><text class="b" x="668" y="505">Supervivencia ≠ enraizamiento</text><text class="b" x="668" y="530">Cuenta raíces y brotes</text><text class="b" x="668" y="553">Mide longitud</text></g>
</svg>
