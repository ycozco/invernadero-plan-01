<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">Guía visual para documentar e identificar el mioporo</title><desc id="d">Cuatro etapas: fotografías con escala de hojas tallos flores y fruto; registro de procedencia; revisión con especialista o herbario; asignación taxonómica antes de usar estudios de una especie.</desc><defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 18px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.leaf{fill:#759c76;stroke:#b2d3a7;stroke-width:2}.vein{stroke:#d4e3cd;stroke-width:2}.accent{fill:#e8a27d}.line{stroke:#506255;stroke-width:3}</style></defs><rect class="bg" width="960" height="500" rx="4"/><g class="stage" data-step="0"><rect class="panel" x="18" y="18" width="220" height="464"/><text class="m" x="36" y="48">01 · FOTOGRAFÍA</text><text class="h" x="36" y="84">Rasgos visibles</text><path class="leaf" d="M123 121 C68 159 76 242 126 276 C174 236 177 157 123 121Z"/><path class="vein" d="M124 134 V261 M121 181 L93 160 M126 205 L154 181 M123 229 L99 214"/><rect x="48" y="300" width="144" height="8" fill="#eef4eb"/><path class="line" d="M48 292 v25 M84 298 v14 M120 292 v25 M156 298 v14 M192 292 v25"/><text class="b" x="37" y="351">Hoja ambas caras</text><text class="b" x="37" y="379">Tallo · flor · fruto</text><text class="b" x="37" y="407">Escala · fecha</text></g><g class="stage" data-step="1"><rect class="panel" x="258" y="18" width="220" height="464"/><text class="m" x="276" y="48">02 · PROCEDENCIA</text><text class="h" x="276" y="84">Registra el origen</text><path d="M314 170 h108 M368 116 v108" stroke="#82c7dc" stroke-width="4"/><circle cx="368" cy="170" r="27" fill="none" stroke="#e8a27d" stroke-width="4"/><text class="b" x="276" y="278">Ubicación / coordenada</text><text class="b" x="276" y="306">Nombre local</text><text class="b" x="276" y="334">Forma y tamaño</text><text class="b" x="276" y="362">Estado fenológico</text><text class="b" x="276" y="418">No deducir por el nombre</text></g><g class="stage" data-step="2"><rect class="panel" x="498" y="18" width="220" height="464"/><text class="m" x="516" y="48">03 · VERIFICACIÓN</text><text class="h" x="516" y="84">Consulta un referente</text><path d="M552 139 h110 v120 h-110z" fill="#232e27" stroke="#82c7dc" stroke-width="2"/><path d="M569 161 h72 M569 181 h56 M569 201 h65 M569 221 h40" class="line"/><circle cx="649" cy="241" r="22" fill="none" stroke="#e8c77a" stroke-width="5"/><path d="M666 258 l20 20" stroke="#e8c77a" stroke-width="6"/><text class="b" x="516" y="326">Herbario o especialista</text><text class="b" x="516" y="354">Guarda quién identificó</text><text class="b" x="516" y="382">Fecha y certeza</text></g><g class="stage" data-step="3"><rect class="panel" x="738" y="18" width="204" height="464"/><text class="m" x="756" y="48">04 · DECISIÓN</text><text class="h" x="756" y="84">Luego el protocolo</text><path d="M839 121 V183 M839 183 L798 222 M839 183 L881 222" fill="none" stroke="#506255" stroke-width="4"/><rect x="763" y="224" width="69" height="42" rx="5" fill="#232e27" stroke="#90bd96" stroke-width="2"/><rect x="846" y="224" width="78" height="42" rx="5" fill="#232e27" stroke="#e8a27d" stroke-width="2"/><text class="b" x="768" y="250">Confirmada</text><text class="b" x="850" y="250">Pendiente</text><text class="b" x="756" y="314">Solo entonces vincula</text><text class="b" x="756" y="342">la especie con estudios</text><text class="b" x="756" y="390">Antes: piloto exploratorio</text></g></svg>
