<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Esquema de piloto exploratorio de esquejes de Myoporum</title><desc id="d">Tras identificar la especie, definir grupos de esquejes comparables, registrar corte y ambiente, evaluar supervivencia y enraizamiento en fechas predefinidas. No representa un protocolo validado.</desc><defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 19px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.leaf{fill:#759c76;stroke:#b2d3a7;stroke-width:2}.stem{stroke:#90bd96;stroke-width:8;fill:none;stroke-linecap:round}.root{stroke:#e8c77a;stroke-width:3;fill:none;stroke-linecap:round}.warn{fill:#e8a27d}</style></defs><rect class="bg" width="960" height="440" rx="4"/><g class="stage" data-step="0"><rect class="panel" x="18" y="18" width="220" height="404"/><text class="m" x="36" y="48">01 · IDENTIDAD</text><text class="h" x="36" y="83">Confirma especie</text><path class="leaf" d="M128 111 C77 149 85 219 128 245 C171 215 177 151 128 111Z"/><path d="M128 125 V231 M124 170 L99 148 M131 195 L155 174" stroke="#d4e3cd" stroke-width="2"/><text class="b" x="38" y="286">Planta madre · fenología</text><text class="b" x="38" y="314">Madera: tierna o semileñosa</text><text class="warn" x="38" y="356" font-family="sans-serif" font-size="14">Identificar antes de comparar</text></g><g class="stage" data-step="1"><rect class="panel" x="258" y="18" width="220" height="404"/><text class="m" x="276" y="48">02 · DISEÑO</text><text class="h" x="276" y="83">Grupos equivalentes</text><rect x="289" y="128" width="67" height="54" rx="6" fill="#232e27" stroke="#82c7dc" stroke-width="2"/><rect x="378" y="128" width="67" height="54" rx="6" fill="#232e27" stroke="#90bd96" stroke-width="2"/><text class="b" x="300" y="161">Control</text><text class="b" x="390" y="161">Trat.</text><text class="b" x="276" y="236">Material homogéneo</text><text class="b" x="276" y="264">Réplicas definidas antes</text><text class="b" x="276" y="292">Sin hormona / tratamiento</text><text class="b" x="276" y="320">Etiquetas individuales</text></g><g class="stage" data-step="2"><rect class="panel" x="498" y="18" width="220" height="404"/><text class="m" x="516" y="48">03 · REGISTRO</text><text class="h" x="516" y="83">Anota condiciones</text><path class="stem" d="M608 225 V130 M608 155 L580 137 M608 178 L636 158"/><path class="leaf" d="M580 137 Q552 118 558 148 Q570 154 580 137Z"/><path class="leaf" d="M636 158 Q662 138 656 168 Q643 175 636 158Z"/><text class="b" x="516" y="273">Largo · nudos · hojas</text><text class="b" x="516" y="301">Medio · humedad · luz</text><text class="b" x="516" y="329">Temperatura · fechas</text><text class="b" x="516" y="376">No hay receta local publicada</text></g><g class="stage" data-step="3"><rect class="panel" x="738" y="18" width="204" height="404"/><text class="m" x="756" y="48">04 · RESULTADO</text><text class="h" x="756" y="83">Evalúa por fecha</text><path d="M778 145 H895" stroke="#506255" stroke-width="5"/><circle cx="791" cy="145" r="12" fill="#82c7dc"/><circle cx="838" cy="145" r="12" fill="#90bd96"/><circle cx="884" cy="145" r="12" fill="#e8c77a"/><path d="M834 204 V267 M834 234 L807 251 M834 241 L861 259" stroke="#d5c19a" stroke-width="4" fill="none"/><text class="b" x="756" y="310">Vivo / enraizado</text><text class="b" x="756" y="338">Fecha primera raíz</text><text class="b" x="756" y="366">N.º y longitud de raíces</text></g><text x="18" y="436" fill="#9aa99e" font-family="sans-serif" font-size="12">Propuesta de registro para un ensayo piloto después de confirmar especie; esquema no es protocolo validado.</text></svg>
