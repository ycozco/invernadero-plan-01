<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">Diseño de comparación de luz en esquejes de Lantana</title><desc id="d">Tres cultivares se comparan bajo 54, 130 y 200 micromoles por metro cuadrado por segundo; se registran condiciones, respuestas en tres semanas e interpretación por cultivar.</desc><defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 18px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.leaf{fill:#759c76;stroke:#b2d3a7;stroke-width:2}.beam{stroke:#e8c77a;stroke-width:4;stroke-dasharray:5 5}.card{fill:#232e27;stroke:#506255;stroke-width:2}</style></defs><rect class="bg" width="960" height="500" rx="4"/><g class="stage" data-step="0"><rect class="panel" x="18" y="18" width="176" height="464"/><text class="m" x="34" y="48">01 · CULTIVAR</text><text class="h" x="34" y="84">Separa</text><circle class="card" cx="106" cy="153" r="40"/><text class="b" x="59" y="218">Copo de oro</text><circle class="card" cx="106" cy="286" r="40"/><text class="b" x="42" y="351">Sonrisa de rosa</text><circle class="card" cx="106" cy="419" r="40"/><text class="b" x="38" y="476">Pequeña amarilla</text></g><g class="stage" data-step="1"><rect class="panel" x="210" y="18" width="230" height="464"/><text class="m" x="228" y="48">02 · INTENSIDAD</text><text class="h" x="228" y="84">Mide la luz</text><g><circle cx="265" cy="153" r="17" fill="#d5c19a"/><path class="beam" d="M265 173 V247"/><circle cx="325" cy="153" r="17" fill="#e8c77a"/><path class="beam" d="M325 173 V247"/><circle cx="385" cy="153" r="17" fill="#e8a27d"/><path class="beam" d="M385 173 V247"/></g><text class="b" x="237" y="276">54</text><text class="b" x="294" y="276">130</text><text class="b" x="356" y="276">200</text><text class="b" x="228" y="310">µmol m⁻² s⁻¹</text><text class="b" x="228" y="361">Réplicas por variedad</text><text class="b" x="228" y="390">Registra posición y periodo</text><text class="b" x="228" y="419">No uses lux como equivalente</text></g><g class="stage" data-step="2"><rect class="panel" x="456" y="18" width="230" height="464"/><text class="m" x="474" y="48">03 · CONTROL</text><text class="h" x="474" y="84">Mantén constante</text><path d="M568 259 V148 M568 184 L528 159 M568 211 L607 184" stroke="#90bd96" stroke-width="8" fill="none" stroke-linecap="round"/><path class="leaf" d="M528 159 Q494 136 507 173 Q521 179 528 159Z"/><path class="leaf" d="M607 184 Q640 159 633 197 Q620 204 607 184Z"/><text class="b" x="474" y="309">Longitud y hojas</text><text class="b" x="474" y="338">Medio · humedad</text><text class="b" x="474" y="367">Temperatura</text><text class="b" x="474" y="414">3 semanas reportadas</text></g><g class="stage" data-step="3"><rect class="panel" x="702" y="18" width="240" height="464"/><text class="m" x="720" y="48">04 · OBSERVA</text><text class="h" x="720" y="84">Mide por esqueje</text><path d="M750 152 H894 M750 189 H878 M750 226 H887 M750 263 H868 M750 300 H893" stroke="#506255" stroke-width="8" stroke-linecap="round"/><circle cx="750" cy="152" r="7" fill="#90bd96"/><circle cx="750" cy="189" r="7" fill="#90bd96"/><circle cx="750" cy="226" r="7" fill="#e8c77a"/><circle cx="750" cy="263" r="7" fill="#82c7dc"/><circle cx="750" cy="300" r="7" fill="#e8a27d"/><text class="b" x="720" y="347">Longitud · nervadura</text><text class="b" x="720" y="375">Raíces adventicias</text><text class="b" x="720" y="403">Defoliación · botones</text><text class="b" x="720" y="448">15 observaciones/grupo</text><g class="stage" data-step="4"><rect x="702" y="18" width="240" height="464" rx="3" fill="none" stroke="#e8a27d" stroke-width="3"/><text class="b" x="720" y="472">Compara resultados por variedad</text></g></g></svg>
