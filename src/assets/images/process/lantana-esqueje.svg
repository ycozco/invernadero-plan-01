<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="t d"><title id="t">Mockup de esqueje semileñoso de Lantana</title><desc id="d">Lámina con selección y corte de tallo de 5 a 6 centímetros y 3 nudos, seis hojas retenidas, aplicación comparativa, bandeja y manejo ambiental, mediciones a 35 y 50 días.</desc><defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 18px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.stem{stroke:#90bd96;stroke-width:8;fill:none;stroke-linecap:round}.twig{stroke:#90bd96;stroke-width:5;fill:none;stroke-linecap:round}.leaf{fill:#759c76;stroke:#b2d3a7;stroke-width:2}.root{stroke:#e8c77a;stroke-width:3;fill:none;stroke-linecap:round}.tray{fill:#232e27;stroke:#82c7dc;stroke-width:2}.accent{fill:#e8a27d}.rule{stroke:#e8a27d;stroke-width:3;stroke-dasharray:6 5}</style></defs><rect class="bg" width="960" height="590" rx="4"/>
<g class="stage" data-step="0"><rect class="panel" x="16" y="16" width="296" height="265"/><text class="m" x="34" y="43">01 · LOTE</text><text class="h" x="34" y="70">Cultivar identificado</text><circle cx="162" cy="130" r="43" fill="#2a211d" stroke="#e8a27d" stroke-width="2"/><text x="134" y="138" fill="#eef4eb" font-family="serif" font-size="23">Ll</text><text class="b" x="43" y="203">Little Lucky · Italia</text><text class="b" x="43" y="230">15 madres · 405 esquejes</text><text class="b" x="43" y="257">3 repeticiones por tratamiento</text></g>
<g class="stage" data-step="1"><rect class="panel" x="332" y="16" width="296" height="265"/><text class="m" x="350" y="43">02 · CORTE</text><text class="h" x="350" y="70">Semileñoso · 5–6 cm</text><path class="stem" d="M480 216 V103"/><path class="twig" d="M480 129 L451 112 M480 151 L510 133 M480 174 L450 158"/><circle cx="480" cy="130" r="6" class="accent"/><circle cx="480" cy="152" r="6" class="accent"/><circle cx="480" cy="174" r="6" class="accent"/><path class="rule" d="M450 216 H510"/><text class="b" x="365" y="250">3 nudos · corte medio</text></g>
<g class="stage" data-step="2"><rect class="panel" x="648" y="16" width="296" height="265"/><text class="m" x="666" y="43">03 · HOJAS</text><text class="h" x="666" y="70">Retén seis</text><path class="stem" d="M796 118 V224"/><path class="twig" d="M796 134 L765 116 M796 147 L826 130 M796 165 L763 149 M796 180 L829 165 M796 197 L765 183 M796 211 L826 198"/><path class="leaf" d="M765 116 Q737 101 744 130 Q757 135 765 116Z"/><path class="leaf" d="M826 130 Q853 111 847 140 Q834 147 826 130Z"/><path class="leaf" d="M763 149 Q735 133 743 161 Q756 167 763 149Z"/><path class="leaf" d="M829 165 Q857 145 849 176 Q837 182 829 165Z"/><path class="leaf" d="M765 183 Q737 168 745 196 Q758 202 765 183Z"/><path class="leaf" d="M826 198 Q853 178 847 209 Q834 215 826 198Z"/><text class="b" x="669" y="250">Retira las hojas basales</text></g>
<g class="stage" data-step="3"><rect class="panel" x="16" y="305" width="296" height="265"/><text class="m" x="34" y="332">04 · TRATAMIENTOS</text><text class="h" x="34" y="359">Compara grupos</text><rect x="40" y="393" width="70" height="55" rx="5" fill="#232e27" stroke="#506255"/><rect x="121" y="393" width="70" height="55" rx="5" fill="#232e27" stroke="#90bd96"/><rect x="202" y="393" width="70" height="55" rx="5" fill="#232e27" stroke="#e8a27d"/><text class="b" x="57" y="426">Control</text><text class="b" x="132" y="426">AIB</text><text class="b" x="205" y="426">Algas</text><text class="b" x="38" y="480">1250 mg/L · inmersión 10 mm</text><text class="b" x="38" y="507">Producto: registra formulación</text><text class="b" x="38" y="534">Goteo® no equivale a todo extracto</text></g>
<g class="stage" data-step="4"><rect class="panel" x="332" y="305" width="296" height="265"/><text class="m" x="350" y="332">05 · AMBIENTE</text><text class="h" x="350" y="359">Bandeja y humedad</text><rect class="tray" x="382" y="407" width="194" height="58" rx="5"/><path d="M395 465 l8 25 h28 l7 -25 M447 465 l8 25 h28 l7 -25 M499 465 l8 25 h28 l7 -25" fill="#232e27" stroke="#506255" stroke-width="2"/><path d="M415 400 v-22 M480 400 v-22 M545 400 v-22" stroke="#82c7dc" stroke-width="4" stroke-linecap="round"/><text class="b" x="350" y="518">Turba:perlita 80:20 · pH 5–6</text><text class="b" x="350" y="544">50% sombra · cama 18 ± 1 °C*</text></g>
<g class="stage" data-step="5"><rect class="panel" x="648" y="305" width="296" height="265"/><text class="m" x="666" y="332">06 · MEDICIÓN</text><text class="h" x="666" y="359">Dos fechas clave</text><circle cx="721" cy="417" r="35" fill="none" stroke="#90bd96" stroke-width="5"/><circle cx="854" cy="417" r="35" fill="none" stroke="#e8a27d" stroke-width="5"/><text class="h" x="696" y="424">35 d</text><text class="h" x="829" y="424">50 d</text><text class="b" x="668" y="480">Raíces &gt;0,5 cm · morfología</text><text class="b" x="668" y="508">% enraizado = con raíz / evaluados</text><text class="b" x="668" y="536">80,7% control · 91,7% AIB*</text></g><text x="16" y="585" fill="#9aa99e" font-family="sans-serif" font-size="11">*Condiciones y resultados publicados para ‘Little Lucky’ en un invernadero de Italia; no receta universal.</text></svg>
