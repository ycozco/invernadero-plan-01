<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Ensayo comparativo de dormancia en semilla de Lantana</title><desc id="d">Dos procedencias con controles de semilla intacta, escarificada y ácido giberélico; observación cada dos días durante 30 días a 27 o 28 grados Celsius.</desc><defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 19px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.fruit{fill:#e8a27d}.seed{fill:#e8c77a}.soil{fill:#796753}.warn{fill:#e8a27d}</style></defs><rect class="bg" width="960" height="440" rx="4"/><g class="stage" data-step="0"><rect class="panel" x="18" y="18" width="220" height="404"/><text class="m" x="36" y="48">01 · PROCEDENCIA</text><text class="h" x="36" y="83">Separa los lotes</text><circle cx="82" cy="151" r="25" class="fruit"/><circle cx="169" cy="151" r="25" fill="#bb7182"/><text class="b" x="47" y="205">Kandy</text><text class="b" x="143" y="205">Ambalangoda</text><text class="b" x="38" y="263">3 réplicas</text><text class="b" x="38" y="291">15 semillas / grupo</text><text class="b" x="38" y="319">Etiquetas individuales</text></g><g class="stage" data-step="1"><rect class="panel" x="258" y="18" width="220" height="404"/><text class="m" x="276" y="48">02 · TRATAMIENTOS</text><text class="h" x="276" y="83">Compara</text><ellipse cx="315" cy="139" rx="11" ry="18" class="seed"/><text class="b" x="338" y="145">Intacta</text><path d="M304 185 l22 22 M326 185 l-22 22" stroke="#e8a27d" stroke-width="3"/><text class="b" x="338" y="203">Escarificada</text><circle cx="315" cy="252" r="19" fill="#232e27" stroke="#82c7dc" stroke-width="3"/><text class="b" x="338" y="258">GA₃ 100 / 500 ppm</text><text class="b" x="276" y="322">Además: luz / oscuridad</text></g><g class="stage" data-step="2"><rect class="panel" x="498" y="18" width="220" height="404"/><text class="m" x="516" y="48">03 · INCUBACIÓN</text><text class="h" x="516" y="83">30 días</text><path d="M551 150 Q608 124 666 150 L655 229 H562Z" class="soil"/><ellipse cx="608" cy="156" rx="8" ry="12" class="seed"/><path d="M541 132 Q608 107 676 132" fill="none" stroke="#506255" stroke-width="5"/><text class="b" x="516" y="276">27–28 °C</text><text class="b" x="516" y="304">Revisa cada 2 días</text><text class="b" x="516" y="332">Anota germinación real</text></g><g class="stage" data-step="3"><rect class="panel" x="738" y="18" width="204" height="404"/><text class="m" x="756" y="48">04 · RESULTADO</text><text class="h" x="756" y="83">Interpreta</text><circle cx="840" cy="163" r="52" fill="none" stroke="#506255" stroke-width="10"/><path d="M840 111 A52 52 0 0 1 870 121" fill="none" stroke="#e8a27d" stroke-width="10"/><text class="h" x="817" y="171">≤20%</text><text class="b" x="756" y="250">Máximo reportado con GA₃</text><text class="b" x="756" y="278">Escarificación sola: 0%</text><text class="b" x="756" y="306">en 30 días</text><text class="warn" x="756" y="350" font-family="sans-serif" font-size="14">No es receta de vivero</text></g></svg>
