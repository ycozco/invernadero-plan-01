<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Esquema exploratorio de semilla de Duranta</title><desc id="d">Registro de lote, siembra pronta con sombra parcial, control de humedad y observación hasta al menos 110 días.</desc><defs><style>.bg{fill:#101612}.panel{fill:#18211b;stroke:#506255;stroke-width:2}.stage{opacity:.62}.stage.is-current{opacity:1}.stage.is-current .panel{stroke:#90bd96;stroke-width:4}.h{fill:#eef4eb;font:600 19px sans-serif}.b{fill:#bdc9bf;font:15px sans-serif}.m{fill:#90bd96;font:600 13px monospace}.fruit{fill:#e8a27d}.soil{fill:#796753}.leaf{fill:#759c76;stroke:#b2d3a7;stroke-width:2}.seed{fill:#e8c77a}</style></defs><rect class="bg" width="960" height="440" rx="4"/><g class="stage" data-step="0"><rect class="panel" x="18" y="18" width="220" height="404"/><text class="m" x="36" y="48">01 · TRAZABILIDAD</text><text class="h" x="36" y="83">Registra origen</text><path d="M98 122 C80 159 79 193 110 201 C142 192 137 159 118 122Z" class="fruit"/><ellipse class="seed" cx="110" cy="174" rx="10" ry="15"/><text class="b" x="38" y="247">Planta madre</text><text class="b" x="38" y="274">Madurez del fruto</text><text class="b" x="38" y="301">Fecha · cantidad</text><text class="b" x="38" y="328">Mantén lotes separados</text></g><g class="stage" data-step="1"><rect class="panel" x="258" y="18" width="220" height="404"/><text class="m" x="276" y="48">02 · SIEMBRA</text><text class="h" x="276" y="83">Semilla fresca</text><path d="M312 139 Q365 112 421 139 L410 217 H324Z" class="soil"/><ellipse class="seed" cx="365" cy="150" rx="9" ry="14"/><path d="M365 151 V121" stroke="#90bd96" stroke-width="5"/><path class="leaf" d="M365 129 Q344 111 349 133 Q357 140 365 129Z"/><path d="M302 111 Q365 86 430 111" fill="none" stroke="#506255" stroke-width="5"/><text class="b" x="278" y="260">Siembra pronto</text><text class="b" x="278" y="288">Sombra parcial reportada</text><text class="b" x="278" y="316">Profundidad no informada</text></g><g class="stage" data-step="2"><rect class="panel" x="498" y="18" width="220" height="404"/><text class="m" x="516" y="48">03 · SEGUIMIENTO</text><text class="h" x="516" y="83">Controla el lote</text><rect x="545" y="127" width="125" height="86" rx="7" fill="#232e27" stroke="#82c7dc" stroke-width="2"/><path d="M558 153 H657 M558 174 H640 M558 194 H650" stroke="#506255" stroke-width="3"/><text class="b" x="516" y="260">Anota medio y riego</text><text class="b" x="516" y="288">Luz · humedad · fecha</text><text class="b" x="516" y="316">Registra emergencia acumulada</text></g><g class="stage" data-step="3"><rect class="panel" x="738" y="18" width="204" height="404"/><text class="m" x="756" y="48">04 · PACIENCIA</text><text class="h" x="756" y="83">90–110 días*</text><circle cx="840" cy="165" r="54" fill="none" stroke="#506255" stroke-width="9"/><path d="M840 111 A54 54 0 0 1 887 191" fill="none" stroke="#e8c77a" stroke-width="9"/><path d="M835 165 l8 -20 M843 165 l15 9" stroke="#eef4eb" stroke-width="4"/><text class="b" x="756" y="260">&lt;20% reportado*</text><text class="b" x="756" y="288">Dato secundario</text><text class="b" x="756" y="316">No es tasa garantizada</text></g><text x="18" y="436" fill="#9aa99e" font-family="sans-serif" font-size="12">*Referencia secundaria; no se localizó el ensayo primario. Diagrama explicativo, no a escala.</text></svg>
